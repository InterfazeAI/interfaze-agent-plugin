name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes:
    name: hermes plugins validate (${{ matrix.hermes.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hermes:
          - name: v0.22.2
            sha: d923a5eb487a17c0a68801bba9ef0f56c81040a8
          - name: v0.23.2
            sha: ae2a81ccc00e9b7c06301523e5bb09608397149c
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes.sha }}
          path: hermes
          persist-credentials: false
      # Hermes declares its core dependencies (ruamel.yaml and others) only for Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Install with uv from inside the checkout so Hermes's [tool.uv] overrides apply.
      - name: Install Hermes
        working-directory: hermes
        run: |
          python -m pip install uv==0.12.3
          python -m uv pip install --system -e ".[mcp]"
      - name: Validate the package
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes plugins validate ./plugin --install-deps

  schemas:
    name: Agent Plugins schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin.json and mcp.json
        run: |
          python -m pip install jsonschema
          curl -fsSL https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o /tmp/plugin.schema.json
          curl -fsSL https://agent-plugins.org/schemas/1.0.0/mcp.schema.json -o /tmp/mcp.schema.json
          python - <<'EOF'
          import json, jsonschema
          for doc, schema in (("plugin.json", "/tmp/plugin.schema.json"), ("mcp.json", "/tmp/mcp.schema.json")):
              jsonschema.validate(json.load(open(doc)), json.load(open(schema)))
              print(f"{doc}: valid")
          EOF
