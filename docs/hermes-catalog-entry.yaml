# Draft of plugin-catalog/interfaze.yaml for the PR to NousResearch/hermes-agent.
# Before the PR: replace <sha> with the full 40-character commit, add image and
# screenshots after the assets exist, and run `hermes plugins validate` at that commit.
name: interfaze
title: Interfaze
repo: https://github.com/InterfazeAI/interfaze-agent-plugin
sha: <sha>
description: >-
  Web search, web scraping, OCR for images, PDFs and Word documents, speech-to-text,
  object and GUI detection, translation, classification and time-series forecasting
  through the hosted Interfaze MCP server (Streamable HTTP, API key), with seven
  skills bundled. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/).
  Disclosure — hosted-only connector with no local code: every tool call goes to the
  Interfaze MCP server at api.interfaze.ai and uses the user's INTERFAZE_API_KEY. It
  sends prompts, search queries, URLs, text, and the images, documents and audio that
  the agent attaches. get_upload_url uploads local files to Interfaze storage.
  Interfaze stores the request payload of each call and logs call metadata unless
  zero data retention is on for the request. Results go into the session context and
  reach the user's model provider. Calls use Interfaze account credits. The tool list
  comes from the server at run time, so the pinned commit does not cover it. The
  package marks the server untrusted, so Hermes asks before get_upload_url. No
  telemetry, no stored credentials, no self-update.
maintainer: InterfazeAI
tier: community
category: web
requires_hermes: ">=0.22.2"
version: "0.1.0"
docs_url: https://github.com/InterfazeAI/interfaze-agent-plugin/blob/<sha>/README.md
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: [INTERFAZE_API_KEY]
